services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - notia-api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notia"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-api:
    image: atendai/evolution-api:latest
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://notia:${POSTGRES_PASSWORD}@postgres:5432/evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://notia-api:3000/webhook/whatsapp
    volumes:
      # Sin este volumen se pierde la sesión de WhatsApp y hay que
      # re-escanear el QR en cada reinicio.
      - evolution-data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  notia-api:
    build: .
    restart: unless-stopped
    command: pnpm exec tsx packages/api/src/index.ts
    environment:
      DATABASE_URL: postgres://notia:${POSTGRES_PASSWORD}@postgres:5432/notia
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_SECRET: ${APP_SECRET}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  notia-worker:
    build: .
    restart: unless-stopped
    command: pnpm exec tsx packages/worker/src/index.ts
    environment:
      DATABASE_URL: postgres://notia:${POSTGRES_PASSWORD}@postgres:5432/notia
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      COMPACT_THRESHOLD: ${COMPACT_THRESHOLD:-40000}
      EVOLUTION_URL: http://evolution-api:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      MI_JID: ${MI_JID}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_SECRET: ${APP_SECRET}
      TZ_USUARIO: ${TZ_USUARIO:-America/Argentina/Buenos_Aires}
      LEAD_MINUTOS: ${LEAD_MINUTOS:-60}
    depends_on:
      # La API corre las migraciones al arrancar; el worker las asume hechas.
      - notia-api

volumes:
  pgdata:
  evolution-data:
  caddy-data:
  caddy-config:
