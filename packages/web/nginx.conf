server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La API vive en otro contenedor. nginx la proxea bajo el mismo origen
    # para que el navegador no vea dos hosts y no haya CORS ni preflight.
    # `notia-api` es el nombre del servicio en compose: lo resuelve el DNS
    # interno de la red, no hace falta ninguna IP.
    location ~ ^/(api|login|u|salud|webhook)/? {
        proxy_pass http://notia-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo la resuelve el router del
    # cliente, así que se devuelve el index y no un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
